[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gis-admin-toolkit"
version = "1.0.0"
description = "Read-only admin tools for ArcGIS Enterprise: SSL certificate expiry, ArcGIS Server service health, and Portal content audits."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Malla Reddy Pashapu" }]
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "cryptography>=42"]
keywords = ["arcgis", "gis", "ssl", "monitoring", "portal", "sysadmin"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.5"]

[project.scripts]
gis-ssl-check = "gisadmin.ssl_check:main"
gis-service-health = "gisadmin.service_health:main"
gis-portal-audit = "gisadmin.portal_audit:main"

[project.urls]
Repository = "https://github.com/mpashapu/gis-admin-toolkit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
